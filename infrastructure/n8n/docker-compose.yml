version: "3.8"

# Self-hosted n8n for PolityMarket daily data pipeline.
# Runs 24/7 but the workflow fires once daily at 2AM IST.
#
# Deployment:
#   docker compose up -d
#
# Access n8n UI:
#   http://localhost:5678
#
# Recommended hosting: Hetzner CX22 (~€4/mo), DigitalOcean Basic ($6/mo),
# or any VPS with 2GB RAM and Docker installed.

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Basic configuration
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.yourdomain.com/
      - GENERIC_TIMEZONE=Asia/Jerusalem

      # Security — change these in production
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme

      # Execution settings
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168  # 7 days

      # Credentials are stored encrypted in n8n's internal SQLite DB.
      # Set the encryption key in production:
      - N8N_ENCRYPTION_KEY=change-this-to-a-random-32-char-string
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
    driver: local
