name: Daily Data Update & Deploy

on:
  schedule:
    # Run daily at 2:00 AM IST (23:30 UTC previous day)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggers
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Stage 1: Update data
  update-data:
    runs-on: ubuntu-latest
    # Only run on schedule or manual trigger, not on push
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pipeline dependencies
        run: npm install

      - name: Run daily score generation
        run: node data-pipeline/generateDailyScores.js
        env:
          # Uncomment and set in repo secrets for real LLM scoring:
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: production

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/timeseries_summary.json public/data/details/
          git diff --staged --quiet || git commit -m "chore: update daily political scores [$(date +%Y-%m-%d)]"
          git push

  # Stage 2: Build and deploy to GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    needs: [update-data]
    # Run after data update, or directly on push to main
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch latest (including any data commit from update-data job)
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
