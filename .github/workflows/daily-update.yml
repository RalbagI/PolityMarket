name: Build & Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POLITYMARKET }}

      - name: Install functions dependencies
        run: npm --prefix functions ci --prefer-offline

      - name: Verify Firebase project
        run: |
          EXPECTED="politymarket"
          RC_PROJECT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default||'')" 2>/dev/null || echo "")
          if [ -n "$RC_PROJECT" ] && [ "$RC_PROJECT" != "$EXPECTED" ]; then
            echo "::error::firebaserc default project is '$RC_PROJECT', expected '$EXPECTED'"
            exit 1
          fi
          echo "Firebase project verified: $EXPECTED"

      - name: Deploy Firebase Functions
        run: npx firebase-tools deploy --only functions --project politymarket --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POLITYMARKET }}
          channelId: live
          projectId: politymarket
