name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# All runners are on the same machine — optimize for shared filesystem.
# Node.js is pre-installed, npm cache is shared across runners.

jobs:
  # Fast checks: lint + security + data validation in one job (~10s of work)
  checks:
    name: Lint & Security
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: ESLint
        run: npx eslint src/

      - name: Prettier
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,json}" "data-pipeline/**/*.js"

      - name: Secrets scan
        run: |
          if grep -rn --include='*.js' --include='*.jsx' --include='*.json' \
            -E '(sk-ant-|AIza[A-Za-z0-9]|ghp_[A-Za-z0-9]|gho_[A-Za-z0-9]|AKIA[A-Z0-9]|xoxb-)' \
            src/ data-pipeline/ 2>/dev/null | grep -v node_modules; then
            echo "ERROR: Potential hardcoded secrets found"
            exit 1
          fi
          echo "PASS: No hardcoded secrets"

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Validate data files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data-pipeline/golden_dataset.json','utf-8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/data/timeseries_summary.json','utf-8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf-8'))"
          for f in public/data/details/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf-8'))"
          done
          echo "PASS: All data files valid"

  # Tests: run in parallel with checks
  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Run tests with coverage
        run: npx vitest run --reporter=verbose --coverage

  # Build: depends on checks + test passing
  build:
    name: Build
    runs-on: self-hosted
    needs: [checks, test]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Build
        run: npx vite build

      - name: Verify no chunk > 500KB
        run: |
          oversized=$(find dist/assets -name '*.js' -size +500k 2>/dev/null)
          if [ -n "$oversized" ]; then
            echo "ERROR: Chunks exceed 500KB:"
            ls -lh $oversized
            exit 1
          fi
          echo "PASS: All chunks under 500KB"
