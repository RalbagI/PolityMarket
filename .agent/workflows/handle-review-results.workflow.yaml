workflow:
  id: handle-review-results
  trigger: /handle-review-results
  mode: write
  agents: 1

metadata:
  updated: "2026-04-06"
  schema_version: "1.1"
  review_cycle_days: 365
  description: >-
    Enforce immediate resolution of all /code-review or
    /monitor-vite findings with context recall before
    execution and memory capture after completion.
  skills: [test, sec, react-best-practices]

handoff:
  to: prepare-for-merge
  schema:
    findings_resolved: { must_fix: int, should_fix: int, nice_to_have: int }
    tests_passing: boolean
    branch: string
  persist_to: .agent/state/handoff_handle-review-results_to_prepare-for-merge.json

circuit_breaker:
  max_retries: 2
  fingerprint_window_minutes: 30
  on_trip: exit_with_report

constraints:
  post_merge_work: deny
  exception_approval: required

input:
  sources: [code-review, monitor-vite]
  finding_types: [must-fix, should-fix, nice-to-have]

phases:
  - id: 0-recall-context
    name: Recall Context
    steps:
      - name: recall-prior-lessons
        type: cmd
        tier: low
        cmd: |
          python3 .agent/bin/workflow-memory.py recall \
            --workflow handle-review-results \
            --topic "code review findings resolution" \
            --limit 8
        store: RECALL_CONTEXT
        fail_action: warn

      - name: read-handoff
        type: cmd
        tier: low
        cmd: |
          cat .agent/state/handoff_code-review_to_handle-review-results.json 2>/dev/null || echo "{}"
        store: UPSTREAM_HANDOFF
        fail_action: warn

      - name: snapshot-start
        type: cmd
        cmd: |
          python3 .agent/bin/workflow-memory.py snapshot \
            --workflow handle-review-results \
            --phase start \
            --note "handle-review-results started"
        fail_action: warn

    next_phase: 1-gather-inputs

  - id: 1-gather-inputs
    name: Gather Findings
    steps:
      - name: get-review-report
        type: cmd
        cmd: "echo 'Analyze latest /code-review or /monitor-vite output'"
        store: REVIEW_SOURCE
        notes: >-
          Agent reads the code-review report from the current
          conversation context. The YAML cannot parse conversation
          history — the agent extracts MUST FIX, SHOULD FIX, and
          NICE TO HAVE items from the most recent review output.

      - name: extract-findings
        type: cmd
        cmd: |
          echo "Agent extracts findings from conversation context"
          echo "Categories: MUST_FIX, SHOULD_FIX, NICE_TO_HAVE"
        store: FINDING_COUNTS
        notes: >-
          This step is agent-interpreted. The agent counts and lists
          all findings from the review report, then proceeds to fix
          each one in priority order (MUST FIX first).

    next_phase: 2-resolve

  - id: 2-resolve
    name: Resolve Findings
    parallel: false
    steps:
      - name: process-findings
        type: cmd
        cmd: |
          echo "Resolving all findings in priority order..."
        store: RESOLUTION_SUMMARY
        notes: >-
          Agent resolves ALL findings:
          1. MUST FIX items first (security, crashes, blockers)
          2. SHOULD FIX items next (quality, performance, a11y)
          3. NICE TO HAVE items last (style, naming, optimization)
          Each fix should be minimal and targeted.

      - name: run-lint
        type: check
        tier: medium
        check: npx eslint src/
        fail_action: exit

      - name: run-tests
        type: check
        tier: medium
        check: npx vitest run
        fail_action: exit

      - name: verify-coverage
        type: check
        tier: medium
        check: npx vitest run --coverage 2>&1 | tail -20
        fail_action: warn

    next_phase: 3-commit

  - id: 3-commit
    name: Commit Resolutions
    steps:
      - name: stage-changes
        type: cmd
        cmd: |
          git add src/ data-pipeline/ tests/ functions/ \
            package.json package-lock.json \
            vite.config.js firebase.json 2>/dev/null || true
        fail_action: warn

      - name: commit-fixes
        type: cmd
        cmd: |
          git commit -m "fix: resolve code review findings" || \
          echo "No changes to commit"

    next_phase: 4-verify

  - id: 4-verify
    name: Verify State
    steps:
      - name: check-clean-state
        type: check
        check: "test -z \"$(git status --porcelain)\""
        acceptable_failure: [none]
        fail_action: exit
    next_phase: 5-capture-memory

  - id: 5-capture-memory
    name: Capture Memory
    steps:
      - name: snapshot-end
        type: cmd
        cmd: |
          python3 .agent/bin/workflow-memory.py snapshot \
            --workflow handle-review-results \
            --phase end \
            --note "handle-review-results completed"
        fail_action: warn

      - name: learn-from-run
        type: cmd
        cmd: |
          python3 .agent/bin/workflow-memory.py learn \
            --workflow handle-review-results \
            --topic "code review findings resolution" \
            --auto
        store: LEARN_RESULT
        fail_action: warn

      - name: write-handoff
        type: cmd
        cmd: |
          cat > .agent/state/handoff_handle-review-results_to_prepare-for-merge.json << HANDOFF
          {
            "from": "handle-review-results",
            "to": "prepare-for-merge",
            "tests_passing": true,
            "branch": "$(git rev-parse --abbrev-ref HEAD)",
            "timestamp": "$(date -Iseconds)"
          }
          HANDOFF
        fail_action: warn

    next_phase: null

next_workflow_suggestion:
  workflow: prepare-for-merge
  message: >-
    IMPORTANT: After completing this workflow, ALWAYS ask the user:
    "Would you like me to run `/prepare-for-merge` to push and create a PR?"
    This must appear as the final line of the workflow output.
    If the user responds affirmatively (yes, y, sure, go ahead, etc.),
    immediately execute the /prepare-for-merge workflow without further prompting.

output:
  format: structured
  sections:
    - memory: [recalled, captured]
    - must-fix: [count, status]
    - should-fix: [count, status]
    - nice-to-have: [count, status]
  next_workflow: prepare-for-merge

validation:
  success_criteria:
    - "Prior lessons recalled"
    - "All MUST_FIX items resolved"
    - "All SHOULD_FIX items resolved or justified"
    - "All NICE_TO_HAVE items resolved or justified"
    - "All tests passing"
    - "Clean git state"
    - "Workflow memory captured"
    - "Suggested /prepare-for-merge as next step"
