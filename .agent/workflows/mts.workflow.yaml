workflow:
  id: mts
  trigger: /mts
  mode: exec
  agents: 1

metadata:
  updated: "2026-03-30"
  review_cycle_days: 365
  description: >-
    Merge This Shit — final-stage workflow that verifies CI,
    merges the current PR, cleans up the branch, pulls main,
    and deploys Firebase if needed. The last step in the
    workflow chain after /prepare-for-merge.
  skills: [github-actions]

constraints:
  post_merge_work: allow
  can_push: false

phases:
  - id: 1-verify-ci
    name: Verify CI
    steps:
      - name: find-pr
        type: cmd
        cmd: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "ERROR: No open PR found for branch $BRANCH"
            exit 1
          fi
          echo "$PR_NUMBER"
        store: PR_NUMBER
        fail_action: exit

      - name: check-ci
        type: cmd
        cmd: gh pr checks "$PR_NUMBER" --watch --fail-fast
        fail_action: run_workflow
        on_fail_workflow: ci-failing
        notes: >-
          Wait for ALL checks to complete. If any check fails,
          automatically invoke /ci-failing to diagnose and fix.
          Only proceed to merge once all checks are green.

      - name: recheck-ci
        type: cmd
        cmd: gh pr checks "$PR_NUMBER"
        fail_action: exit
        notes: >-
          Final gate after /ci-failing has run. If checks still
          fail after the fix attempt, stop and report.

    next_phase: 2-merge

  - id: 2-merge
    name: Merge PR
    steps:
      - name: squash-merge
        type: cmd
        cmd: gh pr merge "$PR_NUMBER" --squash --delete-branch
        fail_action: exit

      - name: verify-merge
        type: cmd
        cmd: gh pr view "$PR_NUMBER" --json state,mergedAt
        store: MERGE_RESULT

    next_phase: 3-cleanup

  - id: 3-cleanup
    name: Cleanup & Pull
    steps:
      - name: checkout-main
        type: cmd
        cmd: git checkout main
        fail_action: exit

      - name: prune-remotes
        type: cmd
        cmd: git remote prune origin

      - name: pull-main
        type: cmd
        cmd: git pull origin main
        fail_action: exit

      - name: verify-clean
        type: check
        check: "test -z \"$(git status --porcelain)\""
        fail_action: warn

    next_phase: 4-deploy

  - id: 4-deploy
    name: Deploy Firebase
    steps:
      - name: build
        type: cmd
        cmd: npx vite build
        fail_action: exit

      - name: install-functions-deps
        type: cmd
        cmd: cd functions && npm ci
        fail_action: warn

      - name: deploy
        type: cmd
        cmd: npx firebase deploy --only hosting,functions,firestore:rules
        fail_action: warn
        notes: >-
          Deploys hosting (frontend), Cloud Functions (API),
          and Firestore security rules in a single pass.

    next_phase: null

output:
  format: structured
  sections:
    - ci: [status]
    - merge: [pr-number, merged-at]
    - cleanup: [branch-deleted, main-pulled]
    - deploy: [firebase-url]

validation:
  success_criteria:
    - "All CI checks passed (auto-fixed via /ci-failing if needed)"
    - "PR merged via squash"
    - "Branch deleted"
    - "Main pulled and clean"
    - "Firebase deployed"
