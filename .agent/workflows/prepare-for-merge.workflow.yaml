workflow:
  id: prepare-for-merge
  trigger: /prepare-for-merge
  mode: exec
  agents: 1

metadata:
  updated: "2026-03-30"
  review_cycle_days: 365
  description: >-
    Single-pass prepare-for-merge for GitHub PRs. Runs all
    checks (lint, format, test, build), syncs main, pushes,
    and generates PR description. Includes workflow memory
    recall at start and capture at end.
  skills: [sec, github-actions, test]

constraints:
  post_merge_work: deny
  can_push: true

phases:
  - id: 0-recall-context
    name: Recall Context
    steps:
      - name: recall-prior-lessons
        type: cmd
        cmd: |
          python3 .agent/bin/workflow-memory.py recall \
            --workflow prepare-for-merge \
            --topic "${TOPIC:-prepare for merge}" \
            --limit 8
        store: RECALL_CONTEXT
        fail_action: warn

      - name: snapshot-start
        type: cmd
        cmd: |
          python3 .agent/bin/workflow-memory.py snapshot \
            --workflow prepare-for-merge \
            --phase start \
            --note "prepare-for-merge started"
        fail_action: warn

    next_phase: 1-preflight

  - id: 1-preflight
    name: Pre-flight Checks
    steps:
      - name: verify-branch
        type: cmd
        cmd: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" = "main" ]; then
            echo "ERROR: Cannot prepare-for-merge from main branch"
            exit 1
          fi
          echo "Branch: $BRANCH"
        store: CURRENT_BRANCH
        fail_action: exit

      - name: sync-main
        type: cmd
        cmd: |
          git fetch origin main
          git rebase origin/main || echo "REBASE_CONFLICT=true"
        fail_action: warn
        notes: >-
          CRITICAL — this step must ALWAYS be executed. If rebase conflicts
          arise, the agent MUST resolve them (read conflicting files, choose
          correct content, git add, git rebase --continue). After rebase,
          force-push the branch since history was rewritten.

      - name: install-deps
        type: cmd
        cmd: npm ci --legacy-peer-deps
        fail_action: exit

    next_phase: 2-validate

  - id: 2-validate
    name: Validate
    parallel: 4
    steps:
      - name: eslint
        type: check
        check: npx eslint src/
        fail_action: exit

      - name: prettier
        type: check
        check: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,json}"
        fail_action: warn

      - name: vitest
        type: check
        check: npx vitest run
        fail_action: exit

      - name: coverage
        type: check
        check: npx vitest run --coverage 2>&1 | tail -20
        fail_action: warn

      - name: vite-build
        type: check
        check: npx vite build
        fail_action: exit

    next_phase: 3-push-and-pr

  - id: 3-push-and-pr
    name: Push & PR
    steps:
      - name: push-branch
        type: cmd
        cmd: git push --force-with-lease -u origin "$(git rev-parse --abbrev-ref HEAD)"
        fail_action: exit

      - name: gather-context
        type: cmd
        cmd: |
          echo "=== COMMITS ==="
          git log origin/main..HEAD --no-merges --oneline
          echo ""
          echo "=== STAT ==="
          git diff --stat origin/main..HEAD
        store: PR_CONTEXT

      - name: create-or-update-pr
        type: doc
        template: pr-description-v1
        notes: >-
          Agent generates a rich PR description from commits
          and diff stat, then posts via gh pr create/update.
          This is the only step that needs LLM intelligence.

    next_phase: 4-self-improve

  - id: 4-self-improve
    name: Self-Improvement
    steps:
      - name: check-autofix-log
        type: cmd
        cmd: cat /tmp/prepare-merge-autofixes.log 2>/dev/null || echo "none"
        store: AUTOFIX_LOG

      - name: update-lessons
        type: doc
        notes: >-
          If any auto-fixes were applied (format, lint, coverage),
          record a lesson in .agent/lessons_learned.md
          so /resolve-issue avoids the same mistake next time.
          Only write if AUTOFIX_LOG is not "none".
        template: lessons-from-autofixes
        target: ".agent/lessons_learned.md"

      - name: commit-lessons
        type: cmd
        cmd: |
          if [ -n "$(git status --porcelain .agent/lessons_learned.md)" ]; then
            git add .agent/lessons_learned.md
            git commit -m "docs: add lessons from prepare-for-merge"
            git push origin "$(git branch --show-current)"
          fi

    next_phase: 5-verify

  - id: 5-verify
    name: Final Verification
    steps:
      - name: check-clean
        type: check
        check: "test -z \"$(git status --porcelain)\""
        fail_action: exit

    next_phase: 10-capture-memory

  - id: 10-capture-memory
    name: Capture Memory
    steps:
      - name: snapshot-end
        type: cmd
        cmd: |
          python3 .agent/bin/workflow-memory.py snapshot \
            --workflow prepare-for-merge \
            --phase end \
            --note "prepare-for-merge completed"
        fail_action: warn

      - name: learn-from-run
        type: cmd
        cmd: |
          python3 .agent/bin/workflow-memory.py learn \
            --workflow prepare-for-merge \
            --topic "${TOPIC:-prepare for merge}" \
            --auto
        store: LEARN_RESULT
        fail_action: warn

    next_phase: null

next_workflow_suggestion:
  workflow: mts
  message: >-
    IMPORTANT: After completing this workflow, ALWAYS ask the user:
    "Would you like me to run `/mts` to merge, cleanup, and deploy?"
    This must appear as the final line of the workflow output.
    If the user responds affirmatively (yes, y, sure, go ahead, etc.),
    immediately execute the /mts workflow without further prompting.

output:
  format: structured
  sections:
    - memory: [recalled, captured]
    - checks: [lint, format, test, build]
    - pr: [description-posted]
    - lessons: [updated-if-needed]
    - git: [clean-state]
  next_workflow: mts
