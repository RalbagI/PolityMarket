workflow:
  id: sync-main
  trigger: /sync-main
  mode: exec

metadata:
  updated: "2026-03-30"
  description: "Sync origin/main into current branch, resolve conflicts, handle compatibility."

phases:
  - id: 1-verify
    name: Verify State
    steps:
      - name: git-status
        type: cmd
        cmd: git status -sb
        fail_action: exit

      - name: fetch-main
        type: cmd
        cmd: git fetch origin main

    next_phase: 2-merge

  - id: 2-merge
    name: Merge Main
    steps:
      - name: merge-main
        type: cmd
        cmd: git merge origin/main --no-edit
        fail_action: warn
        notes: >-
          If merge fails due to conflicts, proceed to conflict
          resolution phase. The agent reads conflicting files,
          resolves each one, and stages the result.

    next_phase: 3-resolve-conflicts

  - id: 3-resolve-conflicts
    name: Resolve Conflicts
    steps:
      - name: identify-conflicts
        type: cmd
        cmd: |
          CONFLICTS=$(git status --short | grep '^UU' | awk '{print $2}')
          if [ -z "$CONFLICTS" ]; then
            echo "No conflicts"
          else
            echo "Conflicting files:"
            echo "$CONFLICTS"
          fi
        store: CONFLICTED_FILES

      - name: resolve-conflicts
        type: cmd
        cmd: echo "Agent resolves each conflicting file"
        notes: >-
          Agent reads each conflicting file listed in CONFLICTED_FILES,
          examines conflict markers (<<<<<<< / ======= / >>>>>>>),
          chooses the correct resolution, removes markers, and runs
          git add on the resolved file. If conflicts are ambiguous
          and require human judgement, stop and ask the user.

      - name: verify-merge
        type: cmd
        cmd: npx vitest run
        fail_action: warn
        notes: >-
          Run tests after conflict resolution to verify nothing broke.

    next_phase: 4-commit

  - id: 4-commit
    name: Commit Merge
    steps:
      - name: stage-resolved
        type: cmd
        cmd: |
          git add src/ data-pipeline/ tests/ functions/ \
            package.json package-lock.json \
            vite.config.js firebase.json 2>/dev/null || true

      - name: commit-merge
        type: cmd
        cmd: |
          git commit -m "chore: sync main into branch" || \
          echo "Already merged"

    next_phase: 5-verify

  - id: 5-verify
    name: Final Verification
    steps:
      - name: check-clean
        type: check
        check: "test -z \"$(git status --porcelain)\""
        fail_action: exit

output:
  format: structured
  sections:
    - merge: [completed]
    - conflicts: [resolved]
    - tests: [passing]

validation:
  success_criteria:
    - "Main merged without unresolved conflicts"
    - "Tests passing"
    - "Clean git state"

note: "No push policy. Use /prepare-for-merge to finalize."
