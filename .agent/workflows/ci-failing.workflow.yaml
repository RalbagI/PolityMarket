workflow:
  id: ci-failing
  trigger: /ci-failing
  mode: exec
  agents: 1

metadata:
  updated: "2026-03-30"
  description: "Fetch, analyze, and fix failing GitHub Actions CI jobs."
  skills: [github-actions, test]

phases:
  - id: 1-fetch-logs
    name: Fetch Logs
    steps:
      - name: find-failed-runs
        type: cmd
        cmd: |
          BRANCH=$(git branch --show-current)
          echo "Branch: $BRANCH"
          echo ""
          echo "=== Recent workflow runs ==="
          gh run list --branch "$BRANCH" --limit 5 --json status,name,databaseId,conclusion \
            --jq '.[] | "\(.databaseId) \(.name) status=\(.status) conclusion=\(.conclusion)"'
        store: FAILED_RUNS

      - name: download-logs
        type: cmd
        cmd: |
          BRANCH=$(git branch --show-current)
          mkdir -p ci-logs
          # Get the most recent failed run
          RUN_ID=$(gh run list --branch "$BRANCH" --limit 5 --json conclusion,databaseId \
            --jq '[.[] | select(.conclusion == "failure")][0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            echo "Downloading logs for run $RUN_ID..."
            gh run view "$RUN_ID" --log > ci-logs/full.log 2>/dev/null || \
              echo "Could not download logs"
            # Extract failed job logs
            grep -i "error\|fail\|ENOENT\|exit code" ci-logs/full.log > ci-logs/errors.log 2>/dev/null || true
            ls -lh ci-logs/ 2>/dev/null
          else
            echo "No failed runs found"
          fi
        store: LOG_FILES

    next_phase: 2-triage

  - id: 2-triage
    name: Triage Failures
    steps:
      - name: categorize-failures
        type: cmd
        cmd: |
          echo "Categories:"
          echo "- transient: timeout, network, runner failure"
          echo "- lint_failure: eslint/prettier errors"
          echo "- test_failure: vitest assertion errors"
          echo "- build_failure: vite build errors"
          echo "- dependency: npm install/audit failures"
        store: FAILURE_TYPES
        notes: >-
          Agent reads ci-logs/errors.log and categorizes each failure.
          Transient failures (timeouts, network) should be retried via
          gh run rerun, not fixed in code.

    next_phase: 3-fix

  - id: 3-fix
    name: Fix Issues
    steps:
      - name: apply-minimal-fix
        type: cmd
        cmd: |
          echo "Applying fixes per category..."
        notes: >-
          Agent applies targeted fixes based on triage categories.
          For lint: npx eslint src/ --fix.
          For test: read failing test, fix code or test.
          For build: read vite error, fix imports or config.
          For dependency: npm ci --legacy-peer-deps.

      - name: run-lint
        type: cmd
        cmd: npx eslint src/ --fix
        fail_action: warn

      - name: run-tests
        type: cmd
        cmd: npx vitest run
        fail_action: warn

      - name: verify-build
        type: cmd
        cmd: npx vite build

      - name: verify-coverage
        type: cmd
        cmd: npx vitest run --coverage 2>&1 | tail -20
        fail_action: warn

    next_phase: 4-commit

  - id: 4-commit
    name: Commit & Push
    steps:
      - name: stage-changes
        type: cmd
        cmd: |
          git add src/ data-pipeline/ tests/ functions/ \
            package.json package-lock.json \
            vite.config.js firebase.json 2>/dev/null || true
        notes: >-
          Stage only known source directories — never use git add .
          to avoid accidentally committing secrets or build artifacts.

      - name: commit-fix
        type: cmd
        cmd: |
          git commit -m "fix(ci): resolve failing jobs" \
            || echo "No changes"

      - name: push
        type: cmd
        cmd: git push

    next_phase: 5-cleanup

  - id: 5-cleanup
    name: Cleanup
    steps:
      - name: remove-logs
        type: cmd
        cmd: rm -rf ci-logs/

      - name: verify-clean
        type: check
        check: "test -z \"$(git status --porcelain)\""

next_workflow_suggestion:
  workflow: handle-review-results
  message: >-
    After fixing CI, ask the user if they want to run
    /handle-review-results to address any remaining code quality issues.

output:
  format: structured
  sections:
    - failures-analyzed: [categories]
    - fixes-applied: [count]
    - tests-passing: [true]
    - pushed: [true]

validation:
  success_criteria:
    - "All failing jobs identified"
    - "Fixes applied"
    - "Tests passing locally"
    - "Build succeeds"
    - "Changes pushed"
    - "Clean state"
