enabled_skills:
  - polity-market-builder
  - testing
  - forge-ci
  - security
  - codebase-cleanup
local_context:
  - README.md
  - package.json
  - .github/workflows
mcp_profile: polity_market
central:
  repo: https://gitlab.com/TalkPoint/AI_Helpers.git
  ref: main
  min_version: 0.3.0
