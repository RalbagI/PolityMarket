project:
  id: polity_market
repo: RalbagI/PolityMarket
default_branch: main
forge: github
enabled_packs: [universal, common]
enabled_workflows:
  - resolve-issue
  - code-review
  - claude-code-review
  - codex-code-review
  - delegate-code-review
  - handle-review-results
  - prepare-for-merge
  - lgtm
  - ci-failing
  - orchestrator
  - sync-default-branch
  - context-health
  - get-up-to-speed
